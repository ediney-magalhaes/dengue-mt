# ============================================================
# Dengue MT — CI/CD Pipeline v2.0
# GitHub Actions
# Testes: a cada push/PR na branch dev e main
# Pipeline semanal: domingo 09h UTC = 06h Cuiabá (UTC-3)
# ============================================================

name: CI/CD — Dengue MT v2.0

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 9 * * 0'   # domingo 09h UTC = 06h Cuiabá
  workflow_dispatch:        # execução manual

jobs:
  # ============================================================
  # JOB 1 — TESTES AUTOMÁTICOS
  # Roda em todo push/PR — valida integridade do código
  # ============================================================
  testes:
    name: pytest — Testes Automáticos
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v5

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}

      - name: Instalar dependências
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restaurar artefatos do HF Hub
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python scripts/restore_artifacts_hf.py --gold --modelo

      - name: Rodar testes pytest
        run: |
          pytest tests/test_pipeline.py -v --tb=short

      - name: Notificar falha
        if: failure()
        run: |
          echo "Testes falharam!"
          echo "Branch: ${{ github.ref }}"
          echo "Commit: ${{ github.sha }}"

  # ============================================================
  # JOB 2 — PIPELINE SEMANAL
  # Roda apenas domingo (schedule) ou manualmente
  # Depende dos testes passarem
  # ============================================================
  pipeline_semanal:
    name: Pipeline Semanal — Ingestão + dbt + Drift + Retreino
    runs-on: ubuntu-latest
    needs: testes
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout código
        uses: actions/checkout@v5

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências Python
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Instalar dbt-core + dbt-duckdb
        run: |
          pip install dbt-core==1.11.7 dbt-duckdb==1.10.1

      - name: Instalar dependências dbt
        run: |
          cd dengue_mt_dbt
          dbt deps
          cd ..

      - name: Configurar dbt profiles
        run: |
          mkdir -p ~/.dbt
          cat > ~/.dbt/profiles.yml << 'EOF'
          dengue_mt_dbt:
            target: dev
            outputs:
              dev:
                type: duckdb
                path: "${{ github.workspace }}/dengue_mt_dbt/dev.duckdb"
                threads: 4
          EOF

      - name: Restaurar artefatos do HF Hub
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python scripts/restore_artifacts_hf.py --gold --modelo --schema --bronze
          
      - name: Executar pipeline semanal
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          MODIS_USUARIO: ${{ secrets.MODIS_USUARIO }}
          MODIS_SENHA: ${{ secrets.MODIS_SENHA }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          python -m src.pipeline_prefect

      - name: Notificar falha
        if: failure()
        run: |
          echo "Pipeline semanal falhou!"
          echo "Data: $(date)"
          echo "Commit: ${{ github.sha }}"