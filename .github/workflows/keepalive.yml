# ============================================================
# Dengue MT — Keep Dashboard Alive
# Ping a cada 4h para evitar hibernação do Streamlit Community Cloud
# Docs: https://docs.streamlit.io/deploy/streamlit-community-cloud/manage-your-app
# ============================================================

name: Keep Dashboard Alive

on:
  schedule:
    # A cada 4 horas: 00:00, 04:00, 08:00, 12:00, 16:00, 20:00 UTC
    - cron: '0 */4 * * *'
  workflow_dispatch:  # permite disparo manual para teste

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping dashboard
        run: |
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://dengue-mt-ifmt.streamlit.app)
          echo "Dashboard respondeu com HTTP $HTTP_STATUS"
          if [ "$HTTP_STATUS" -ge 500 ]; then
            echo "::warning::Dashboard retornou erro $HTTP_STATUS"
            exit 1
          fi