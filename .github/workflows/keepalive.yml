# ============================================================
# Dengue MT — Keep Dashboard Alive (Playwright)
# Usa Chromium headless para renderizar a página de fato,
# contornando o problema de curl receber apenas o shell HTML
# estático sem iniciar o processo Python do app.
# Ref: https://zenn.dev/shogaku/articles/streamlit-keepalive-playwright
# ============================================================
name: Keep Dashboard Alive
on:
  schedule:
    # A cada 4 horas: 00:00, 04:00, 08:00, 12:00, 16:00, 20:00 UTC
    - cron: '0 */4 * * *'
  workflow_dispatch:  # permite disparo manual para teste
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Playwright
        run: |
          pip install playwright
          playwright install chromium --with-deps

      - name: Ping dashboard (Playwright)
        run: python scripts/keepalive.py

      - name: Upload debug screenshot (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: keepalive-debug
          path: keepalive_debug.png
          retention-days: 7