version: 2

sources:
  - name: bronze_infodengue
    description: "Dados brutos da API InfoDengue — casos e clima por município/SE"
    meta:
      external_location: "read_parquet('{{ var(\"bronze_path\") }}/infodengue/infodengue_*.parquet')"
    tables:
      - name: cuiaba
        description: "InfoDengue Cuiabá (geocode 5103403) — 2018→2026"
        meta:
          external_location: "read_parquet('{{ var(\"bronze_path\") }}/infodengue/infodengue_cuiaba_*.parquet')"
      - name: varzea_grande
        description: "InfoDengue Várzea Grande (geocode 5108402) — 2018→2026"
        meta:
          external_location: "read_parquet('{{ var(\"bronze_path\") }}/infodengue/infodengue_varzea_grande_*.parquet')"

  - name: bronze_nasa_power
    description: "Dados brutos NASA POWER — variáveis climáticas diárias"
    tables:
      - name: cuiaba
        description: "NASA POWER Cuiabá 2018→2026"
        meta:
          external_location: "read_parquet('{{ var(\"bronze_path\") }}/nasa_power/nasa_power_cuiaba_*.parquet')"
      - name: varzea_grande
        description: "NASA POWER Várzea Grande 2018→2026"
        meta:
          external_location: "read_parquet('{{ var(\"bronze_path\") }}/nasa_power/nasa_power_varzea_grande_*.parquet')"

  - name: bronze_oni
    description: "Índice ONI NOAA — El Niño/La Niña trimestral"
    tables:
      - name: oni_latest
        description: "ONI Index série completa"
        meta:
          external_location: "read_parquet('{{ var(\"bronze_path\") }}/oni/oni_index_latest.parquet')"

  - name: bronze_trends
    description: "Google Trends — interesse por dengue"
    tables:
      - name: trends_latest
        description: "Google Trends mais recente"
        meta:
          external_location: "read_parquet('{{ var(\"bronze_path\") }}/trends/trends_dengue_latest.parquet')"
      - name: trends_historico
        description: "Google Trends histórico 2018→2025 via overlapping windows"
        meta:
          external_location: "read_parquet('{{ var(\"bronze_path\") }}/trends/trends_dengue_historico_2018_2025.parquet')"

  - name: bronze_gee
    description: "Google Earth Engine — NDVI, NDWI mensal 2018→2024"
    tables:
      - name: gee_blend
        description: "GEE NDVI/NDWI blend Sentinel-2 + MODIS"
        meta:
          external_location: "read_parquet('{{ var(\"bronze_path\") }}/gee/gee_ndvi_ndwi_blend_2018_2024.parquet')"
  
  - name: bronze_modis
    description: "MODIS MOD13A3 — NDVI e EVI mensais 1km via AppEEARS NASA. Período 2018→atual."
    tables:
      - name: modis_latest
        description: "MODIS NDVI/EVI — Cuiabá + Várzea Grande 2018→atual"
        meta:
          external_location: "read_parquet('{{ var(\"bronze_path\") }}/modis/modis_ndvi_evi_latest.parquet')"